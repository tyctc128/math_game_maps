<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>數學冒險島</title>
    <style>
:root {
  --ink: #142033;
  --muted: #617086;
  --panel: rgba(255, 250, 238, 0.94);
  --line: rgba(255, 255, 255, 0.42);
  --gold: #f4b73f;
  --green: #1f8f6b;
  --red: #c64337;
  font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    linear-gradient(180deg, rgba(8, 20, 34, 0.78), rgba(14, 30, 43, 0.62)),
    url("assets/generated/math-islands-map.png") center / cover fixed;
}

button, input { font: inherit; }
button { cursor: pointer; }

.intro {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 20px;
  background:
    radial-gradient(circle at 50% 38%, rgba(255, 219, 112, .22), transparent 30%),
    linear-gradient(180deg, rgba(5, 14, 25, .86), rgba(8, 22, 34, .78)),
    url("assets/generated/math-islands-map.png") center / cover;
}

.intro-card {
  width: min(820px, 100%);
  min-height: 360px;
  padding: 26px;
  border-radius: 8px;
  border: 3px solid rgba(91, 58, 28, .54);
  background:
    linear-gradient(180deg, rgba(255, 248, 221, .96), rgba(235, 197, 121, .94));
  box-shadow: 0 26px 80px rgba(0,0,0,.45), inset 0 0 0 5px rgba(255,255,255,.25);
}

.elder-scene {
  display: grid;
  grid-template-columns: minmax(150px, 220px) 1fr;
  gap: 20px;
  align-items: center;
}

.elder-scene img {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  filter: drop-shadow(0 18px 16px rgba(0,0,0,.32));
}

.intro-kicker {
  margin: 0 0 6px;
  color: #1d735e;
  font-weight: 900;
}

.intro-card h2 {
  margin: 0 0 16px;
  font-size: clamp(2rem, 5vw, 3.6rem);
  line-height: 1;
  color: #3b281c;
}

.typewriter {
  min-height: 132px;
  margin: 0;
  color: #3b281c;
  font-size: clamp(1.1rem, 2.4vw, 1.45rem);
  font-weight: 900;
  line-height: 1.75;
  white-space: pre-line;
}

.typewriter::after {
  content: "";
  display: inline-block;
  width: 10px;
  height: 1.1em;
  margin-left: 4px;
  background: #3b281c;
  vertical-align: -2px;
  animation: caretBlink .75s steps(1) infinite;
}

.intro-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.intro-actions .primary {
  width: auto;
  min-width: 150px;
}

.ghost-button {
  min-height: 54px;
  padding: 12px 18px;
  border: 2px solid rgba(91, 58, 28, .32);
  border-radius: 8px;
  background: rgba(255,255,255,.44);
  color: #3b281c;
  font-weight: 900;
}

@keyframes caretBlink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

.game {
  width: min(1480px, 100%);
  margin: 0 auto;
  padding: 16px;
}

.hud {
  display: grid;
  grid-template-columns: 100px 52px minmax(420px, 760px);
  gap: 14px;
  align-items: end;
  margin-bottom: 12px;
}

.sound-toggle {
  width: 52px;
  height: 52px;
  border-radius: 999px;
  border: 2px solid rgba(255, 245, 198, .52);
  background: linear-gradient(180deg, rgba(255, 248, 218, .94), rgba(230, 184, 93, .9));
  color: #3b281c;
  font-size: 1.45rem;
  box-shadow: 0 12px 28px rgba(0,0,0,.24);
}

.sound-toggle.on {
  background: linear-gradient(180deg, #fff4ba, #7bd6ff);
}

h1 {
  margin: 0;
  color: #fff7df;
  font-size: clamp(1.1rem, 2vw, 1.65rem);
  line-height: 1;
  letter-spacing: 0;
  text-shadow: 0 4px 12px rgba(0,0,0,.42);
}

.status-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.status-strip div,
.islands,
.power,
.map-caption,
.modal-card {
  border: 1px solid var(--line);
  background: var(--panel);
  box-shadow: 0 18px 48px rgba(0,0,0,.24);
  backdrop-filter: blur(10px);
}

.status-strip div {
  min-height: 72px;
  padding: 10px 12px;
  border-radius: 8px;
}

.status-strip b {
  display: block;
  font-size: 1.2rem;
}

.status-strip span,
.island-card span,
.power label,
.ability-grid span {
  color: var(--muted);
  font-weight: 800;
  font-size: .88rem;
}

.world {
  position: relative;
  display: block;
}

.islands,
.power {
  position: absolute;
  z-index: 6;
  border-radius: 8px;
  padding: 10px;
}

.islands {
  left: 14px;
  top: 14px;
  width: 72px;
  display: grid;
  gap: 8px;
  align-content: start;
  background:
    linear-gradient(180deg, rgba(255, 246, 215, .93), rgba(226, 187, 111, .88));
  border-color: rgba(103, 70, 30, .34);
}

.power {
  right: 16px;
  top: 16px;
  width: 210px;
  background:
    linear-gradient(180deg, rgba(255, 246, 215, .93), rgba(226, 187, 111, .88));
  border-color: rgba(103, 70, 30, .34);
}

.island-card {
  display: grid;
  place-items: center;
  min-height: 54px;
  padding: 6px;
  border: 2px solid transparent;
  border-radius: 8px;
  background: rgba(255,255,255,.72);
  color: var(--ink);
  text-align: left;
}

.island-card.active {
  border-color: var(--gold);
  background: #fff3d3;
}

.badge {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 3px solid rgba(20,32,51,.18);
}

.rock { background: linear-gradient(135deg,#826554,#d2a36c); }
.lake { background: linear-gradient(135deg,#70e3e8,#247cc4); }
.clock { background: radial-gradient(circle,#fff 30%,#d1a03d 34% 55%,#604931 58%); }

.map-wrap {
  position: relative;
  min-width: 0;
}

.map-art {
  position: relative;
  height: calc(100vh - 116px);
  min-height: 620px;
  overflow: hidden;
  border-radius: 8px;
  border: 3px solid rgba(255,255,255,.72);
  background:
    linear-gradient(180deg, rgba(255,255,255,.02), rgba(6,16,30,.08)),
    url("assets/generated/math-islands-map.png") center / cover;
  box-shadow: 0 24px 60px rgba(0,0,0,.34);
  touch-action: manipulation;
}

.map-art::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 110%, rgba(0,0,0,.34), transparent 42%),
    linear-gradient(180deg, rgba(255,255,255,.08), transparent 30%);
}

.map-node {
  position: absolute;
  z-index: 2;
  width: clamp(86px, 7vw, 118px);
  height: clamp(86px, 7vw, 118px);
  border: 0;
  border-radius: 0;
  padding: 0;
  background: transparent;
  color: transparent;
  box-shadow: none;
  filter:
    drop-shadow(0 14px 12px rgba(0,0,0,.34))
    drop-shadow(0 0 10px rgba(255, 220, 96, .58));
  transition: transform .16s ease, filter .16s ease;
  animation: floatPrompt 2.4s ease-in-out infinite;
}

.map-node:hover,
.map-node:focus-visible {
  transform: translateY(-5px) scale(1.06);
  filter:
    drop-shadow(0 18px 15px rgba(0,0,0,.42))
    drop-shadow(0 0 20px rgba(255, 235, 126, .9));
  outline: 0;
}

.map-node.visited {
  cursor: default;
  opacity: .5;
  filter: grayscale(1) drop-shadow(0 10px 8px rgba(0,0,0,.24));
  animation: none;
}

.map-node.visited::before,
.map-node.visited::after {
  display: none;
}

.map-node.visited:hover,
.map-node.visited:focus-visible {
  transform: none;
  filter: grayscale(1) drop-shadow(0 10px 8px rgba(0,0,0,.24));
}

.map-node img {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

.map-node::before,
.map-node::after {
  content: "";
  position: absolute;
  pointer-events: none;
  border-radius: 999px;
}

.map-node::before {
  inset: 18%;
  z-index: 0;
  background: radial-gradient(circle, rgba(255, 236, 150, .86), rgba(255, 208, 77, .32) 38%, transparent 68%);
  filter: blur(8px);
  animation: glowPulse 1.8s ease-in-out infinite;
}

.map-node::after {
  right: 8%;
  top: 10%;
  z-index: 3;
  width: 16px;
  height: 16px;
  background:
    linear-gradient(90deg, transparent 42%, #fff7bc 43% 57%, transparent 58%),
    linear-gradient(0deg, transparent 42%, #fff7bc 43% 57%, transparent 58%);
  filter: drop-shadow(0 0 8px rgba(255, 240, 140, .95));
  animation: sparkle 1.35s ease-in-out infinite;
}

@keyframes floatPrompt {
  0%, 100% { margin-top: 0; }
  50% { margin-top: -7px; }
}

@keyframes glowPulse {
  0%, 100% { opacity: .42; transform: scale(.88); }
  50% { opacity: .92; transform: scale(1.2); }
}

@keyframes sparkle {
  0%, 100% { opacity: .25; transform: scale(.7) rotate(0deg); }
  45% { opacity: 1; transform: scale(1.18) rotate(45deg); }
}

.node-treasure { left: 18%; top: 58%; }
.node-treasure-2 { left: 29%; top: 35%; transform: scale(.86); }
.node-treasure-3 { left: 76%; top: 57%; transform: scale(.82); }
.node-bridge { left: 40%; top: 48%; width: clamp(112px, 10vw, 160px); }
.node-bridge-2 { left: 54%; top: 62%; width: clamp(106px, 9vw, 148px); transform: rotate(-8deg) scale(.9); }
.node-door { left: 68%; top: 26%; width: clamp(104px, 9vw, 142px); height: clamp(104px, 9vw, 142px); }
.node-door-2 { left: 34%; top: 17%; width: clamp(96px, 8vw, 130px); height: clamp(96px, 8vw, 130px); transform: scale(.86); }
.node-npc { left: 67%; top: 66%; }
.node-npc-2 { left: 23%; top: 74%; transform: scale(.78); }
.node-npc-3 { left: 82%; top: 34%; transform: scale(.82); }
.node-boss { left: 46%; top: 13%; width: clamp(120px, 11vw, 170px); height: clamp(120px, 11vw, 170px); }
.node-boss.locked { filter: grayscale(.8); opacity: .58; }

.map-art.time-mode {
  background:
    linear-gradient(180deg, rgba(255,255,255,.02), rgba(9, 42, 31, .08)),
    url("assets/generated/time-garden-map.png") center / cover;
}

.map-art.time-mode .map-node {
  width: clamp(74px, 6vw, 102px);
  height: clamp(74px, 6vw, 102px);
}

.map-art.time-mode .time-hidden-node {
  display: none;
}

.map-art.time-mode .node-treasure { left: 18%; top: 68%; }
.map-art.time-mode .node-treasure-2 { left: 24%; top: 36%; transform: scale(.82); }
.map-art.time-mode .node-treasure-3 { left: 35%; top: 76%; transform: scale(.86); }
.map-art.time-mode .node-bridge { left: 45%; top: 53%; width: clamp(74px, 6vw, 102px); }
.map-art.time-mode .node-bridge-2 { left: 56%; top: 74%; width: clamp(74px, 6vw, 102px); transform: scale(.88); }
.map-art.time-mode .node-door { left: 68%; top: 40%; width: clamp(74px, 6vw, 102px); height: clamp(74px, 6vw, 102px); }
.map-art.time-mode .node-door-2 { left: 73%; top: 68%; width: clamp(74px, 6vw, 102px); height: clamp(74px, 6vw, 102px); transform: scale(.86); }
.map-art.time-mode .node-npc { left: 76%; top: 34%; }
.map-art.time-mode .node-boss {
  left: 63%;
  top: 24%;
  width: clamp(132px, 11vw, 184px);
  height: clamp(132px, 11vw, 184px);
  opacity: 1;
  filter: drop-shadow(0 18px 18px rgba(0, 0, 0, .48)) drop-shadow(0 0 24px rgba(255, 220, 118, .82));
}

.map-art.time-mode .node-boss img {
  transform: scale(1.16);
}

.map-art.time-mode .node-boss.locked {
  opacity: .62;
  filter: grayscale(.8) drop-shadow(0 12px 14px rgba(0,0,0,.38));
}

.map-art.time-mode .node-boss:not(.locked)::before {
  inset: 0;
  background: radial-gradient(circle, rgba(255, 244, 158, .72), rgba(255, 205, 72, .28) 42%, transparent 72%);
}

.map-art.time-mode .node-boss:not(.locked)::after {
  width: 22px;
  height: 22px;
}

.boss-taunt {
  position: absolute;
  z-index: 8;
  left: 55%;
  top: 10%;
  width: min(260px, 34vw);
  padding: 12px 14px;
  border: 3px solid rgba(91, 58, 28, .42);
  border-radius: 8px;
  background: linear-gradient(180deg, rgba(255, 248, 221, .96), rgba(236, 198, 121, .94));
  color: #3b281c;
  box-shadow: 0 16px 34px rgba(0,0,0,.26);
  animation: tauntPop .28s ease-out, tauntFloat 1s ease-in-out infinite alternate .28s;
}

.boss-taunt::before {
  content: "";
  position: absolute;
  left: -18px;
  top: 38px;
  width: 0;
  height: 0;
  border-top: 12px solid transparent;
  border-bottom: 12px solid transparent;
  border-right: 18px solid rgba(236, 198, 121, .94);
}

.boss-taunt b,
.boss-taunt span {
  display: block;
  font-weight: 900;
}

.boss-taunt span {
  margin-top: 4px;
  font-size: 1.1rem;
}

.map-art.time-mode .boss-taunt {
  left: auto;
  right: 20%;
  top: 5%;
  width: min(240px, 30vw);
  transform-origin: 78% 90%;
}

.map-art.time-mode .boss-taunt::before {
  left: auto;
  right: 34px;
  top: auto;
  bottom: -18px;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 18px solid rgba(236, 198, 121, .94);
  border-bottom: 0;
}

@keyframes tauntPop {
  from { opacity: 0; transform: scale(.82); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes tauntFloat {
  from { margin-top: 0; }
  to { margin-top: -6px; }
}

.tutorial-arrow {
  position: absolute;
  z-index: 7;
  left: calc(18% - 118px);
  top: calc(58% - 30px);
  width: 86px;
  height: 58px;
  pointer-events: none;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,.32));
  animation: arrowNudge .72s ease-in-out infinite alternate;
}

.tutorial-arrow::before {
  content: "";
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 0;
  height: 0;
  border-top: 22px solid transparent;
  border-bottom: 22px solid transparent;
  border-left: 38px solid #ffd743;
}

.tutorial-arrow::after {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 52px;
  height: 20px;
  border-radius: 999px;
  background: #ffd743;
}

.tutorial-arrow.hidden {
  display: none;
}

@keyframes arrowNudge {
  from { transform: translateX(-8px); }
  to { transform: translateX(10px); }
}

.hero {
  position: absolute;
  z-index: 3;
  left: 18%;
  top: 63%;
  width: clamp(94px, 9vw, 132px);
  height: clamp(94px, 9vw, 132px);
  transform: translate(-50%, -88%);
  transition: left .18s linear, top .18s linear;
  pointer-events: none;
  filter: drop-shadow(0 16px 14px rgba(0,0,0,.42));
}

.hero.moving img { animation: hop .42s ease-in-out infinite alternate; }
.hero.walking img {
  animation: rpgStride .34s linear infinite;
  transform-origin: 50% 88%;
}
.hero.face-left {
  transform: translate(-50%, -88%) scaleX(-1);
}
.map-art.time-mode .hero {
  width: clamp(76px, 7vw, 106px);
  height: clamp(76px, 7vw, 106px);
  transition: none;
}
.map-art.time-mode .hero::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 5%;
  width: 44%;
  height: 12%;
  border-radius: 50%;
  background: rgba(28, 22, 14, .28);
  transform: translateX(-50%);
  filter: blur(3px);
  z-index: -1;
}
.hero img { width: 100%; height: 100%; object-fit: contain; }
.hero.hit img { animation: hitFlash .18s ease-in-out 2; }

@keyframes hop {
  from { transform: translateY(0) rotate(-1deg); }
  to { transform: translateY(-8px) rotate(1deg); }
}

@keyframes runStride {
  from { transform: translateY(0) rotate(-2deg) scale(1); }
  to { transform: translateY(-7px) rotate(2deg) scale(1.03); }
}

@keyframes rpgStride {
  0% { transform: translate3d(-2px, 0, 0) rotate(-2deg) scaleY(1); }
  25% { transform: translate3d(0, -5px, 0) rotate(1deg) scaleY(.985); }
  50% { transform: translate3d(2px, 0, 0) rotate(2deg) scaleY(1); }
  75% { transform: translate3d(0, -5px, 0) rotate(-1deg) scaleY(.985); }
  100% { transform: translate3d(-2px, 0, 0) rotate(-2deg) scaleY(1); }
}

.map-caption {
  position: absolute;
  z-index: 6;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  width: min(560px, calc(100% - 36px));
  min-height: 56px;
  margin-top: 0;
  padding: 14px 16px;
  border-radius: 8px;
  font-weight: 900;
  background:
    linear-gradient(180deg, rgba(255, 246, 215, .95), rgba(231, 191, 109, .9));
  border-color: rgba(103, 70, 30, .34);
  text-align: center;
}

.map-art.flight-mode {
  background:
    linear-gradient(90deg, rgba(82, 210, 231, .1), rgba(255,255,255,.02), rgba(48, 123, 190, .12)),
    url("assets/generated/decimal-flight-bg.png") center / cover;
  cursor: none;
}

.map-art.flight-mode::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    url("assets/generated/decimal-flight-bg.png") center / cover,
    repeating-linear-gradient(90deg, rgba(255,255,255,.32) 0 2px, transparent 2px 90px);
  background-blend-mode: screen;
  opacity: .32;
  animation: scrollWind 16s linear infinite;
}

.map-art.flight-mode .map-node:not(.node-boss) {
  display: none;
}

.map-art.flight-mode .node-boss.locked {
  display: none;
}

.map-art.flight-paused .flight-object {
  animation-play-state: paused;
}

.map-art.flight-hit {
  animation: flightScreenHit .32s ease-in-out 2;
}

.map-art.flight-hit::after {
  background:
    radial-gradient(circle at 50% 50%, rgba(255, 235, 155, .18), transparent 28%),
    linear-gradient(180deg, rgba(255, 42, 42, .28), rgba(255, 122, 38, .08)),
    radial-gradient(circle at 50% 110%, rgba(0,0,0,.34), transparent 42%);
}

@keyframes scrollWind {
  from { background-position-x: 0, 0; }
  to { background-position-x: -520px, -180px; }
}

@keyframes flightScreenHit {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-5px, 3px); }
  50% { transform: translate(5px, -2px); }
  75% { transform: translate(-3px, -4px); }
}

.flight-object {
  position: absolute;
  z-index: 4;
  width: clamp(64px, 7vw, 96px);
  height: clamp(64px, 7vw, 96px);
  transform: translate(-50%, -50%);
  border: 0;
  border-radius: 999px;
  background: transparent;
  filter: drop-shadow(0 12px 12px rgba(0,0,0,.26));
  animation: flightBob 1.1s ease-in-out infinite alternate;
  pointer-events: none;
}

.flight-object.question {
  width: clamp(88px, 9vw, 132px);
  height: clamp(88px, 9vw, 132px);
  background: radial-gradient(circle, rgba(255, 237, 104, .38), transparent 68%);
}

.flight-object.reward {
  background: radial-gradient(circle, rgba(255, 236, 126, .78), transparent 62%);
}

.flight-object.monster {
  width: clamp(82px, 8vw, 118px);
  height: clamp(82px, 8vw, 118px);
}

.flight-object img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

.flight-alert {
  position: absolute;
  z-index: 10;
  left: 50%;
  top: 28%;
  min-width: min(420px, calc(100% - 48px));
  padding: 18px 22px;
  border-radius: 8px;
  border: 3px solid rgba(255, 235, 168, .82);
  background:
    radial-gradient(circle at 18% 34%, rgba(255, 236, 128, .7), transparent 30%),
    linear-gradient(135deg, rgba(166, 38, 28, .96), rgba(229, 84, 39, .94));
  color: #fff8dc;
  text-align: center;
  box-shadow: 0 22px 48px rgba(50, 18, 12, .38), 0 0 26px rgba(255, 215, 92, .56);
  opacity: 0;
  transform: translate(-50%, -50%) scale(.72);
  pointer-events: none;
}

.flight-alert.show {
  animation: flightAlertPop 1.05s ease-out forwards;
}

.flight-alert b {
  display: block;
  font-size: clamp(1.8rem, 5vw, 3.25rem);
  line-height: 1.05;
  text-shadow: 0 4px 0 rgba(87, 27, 15, .42);
}

.flight-alert span {
  display: block;
  margin-top: 8px;
  font-size: clamp(1rem, 2.4vw, 1.35rem);
  font-weight: 900;
}

@keyframes flightAlertPop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.62); }
  16% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  72% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(.92); }
}

.flight-controls {
  position: absolute;
  z-index: 9;
  left: 18px;
  bottom: 84px;
  display: grid;
  grid-template-columns: repeat(3, 58px);
  grid-template-areas:
    ". up ."
    "left down right";
  gap: 8px;
  padding: 10px;
  border-radius: 8px;
  background: rgba(19, 64, 87, .42);
  backdrop-filter: blur(8px);
  border: 2px solid rgba(255, 255, 255, .22);
}

.flight-controls button {
  min-height: 58px;
  border: 2px solid rgba(25, 102, 118, .32);
  border-radius: 8px;
  background:
    radial-gradient(circle at 50% 24%, rgba(255, 255, 255, .72), transparent 38%),
    linear-gradient(180deg, #d9fff1, #6fc5d2);
  color: #12374a;
  font-weight: 900;
  font-size: 1.35rem;
  box-shadow: 0 7px 0 rgba(25, 86, 102, .3), 0 12px 20px rgba(18, 48, 71, .2);
  touch-action: none;
}

.flight-controls [data-flight-move="up"] { grid-area: up; }
.flight-controls [data-flight-move="left"] { grid-area: left; }
.flight-controls [data-flight-move="down"] { grid-area: down; }
.flight-controls [data-flight-move="right"] { grid-area: right; }

@keyframes flightBob {
  from { margin-top: -4px; }
  to { margin-top: 8px; }
}

.power h2 { margin: 4px 0 14px; }
.power label { display: flex; justify-content: space-between; margin: 12px 0 6px; }

.bar {
  overflow: hidden;
  height: 16px;
  border-radius: 999px;
  background: rgba(20,32,51,.16);
}

.bar i {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg,#f07a37,#f4c64c);
  transition: width .24s ease;
}

.ability-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin: 16px 0;
}

.ability-grid div {
  padding: 10px 6px;
  border-radius: 8px;
  background: rgba(255,255,255,.7);
  text-align: center;
}

.ability-grid b { display: block; font-size: 1.5rem; }

.inventory-panel {
  margin: 10px 0 14px;
  padding: 10px;
  border-radius: 8px;
  background: rgba(255,255,255,.55);
  border: 1px solid rgba(103, 70, 30, .18);
}

.inventory-panel > span {
  display: block;
  margin-bottom: 8px;
  color: #5f4425;
  font-weight: 900;
}

.inventory-icons {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  min-height: 42px;
}

.inventory-chip {
  position: relative;
  width: 42px;
  height: 42px;
  border-radius: 8px;
  background: linear-gradient(180deg, #fff7d8, #e8bc68);
  border: 2px solid rgba(91, 58, 28, .25);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
}

.inventory-chip img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 4px;
}

.inventory-chip b {
  position: absolute;
  right: -5px;
  bottom: -5px;
  min-width: 20px;
  height: 20px;
  padding: 0 4px;
  border-radius: 999px;
  background: #d64b42;
  color: white;
  font-size: .78rem;
  line-height: 20px;
  text-align: center;
}

.primary,
.answer-button,
.close,
.number-pad button {
  border: 0;
  border-radius: 8px;
  font-weight: 900;
}

.primary {
  width: 100%;
  min-height: 54px;
  padding: 12px 16px;
  color: #fff;
  background: linear-gradient(135deg,#e15b2f,#bd392f);
  box-shadow: 0 10px 20px rgba(173,63,39,.25);
}

.primary:disabled {
  cursor: not-allowed;
  background: #9a9a9a;
  box-shadow: none;
}

.hidden { display: none !important; }

.modal {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 18px;
  background:
    radial-gradient(circle at 50% 42%, rgba(255, 213, 111, .18), transparent 26%),
    rgba(7,14,25,.7);
}

.modal-card {
  width: min(760px, 100%);
  max-height: min(92vh, 760px);
  overflow: auto;
  border-radius: 8px;
  padding: 0;
  border: 3px solid rgba(91, 58, 28, .52);
  background:
    linear-gradient(180deg, rgba(255, 250, 226, .97), rgba(245, 224, 172, .98)),
    #f4dfaa;
  box-shadow:
    0 24px 70px rgba(0,0,0,.42),
    inset 0 0 0 5px rgba(255,255,255,.26);
}

.boss-card {
  width: min(1180px, calc(100vw - 22px));
  max-height: calc(100vh - 22px);
}

.modal-card header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background:
    linear-gradient(90deg, rgba(108, 72, 38, .94), rgba(153, 96, 43, .9)),
    #80512d;
  color: #fff4d6;
}

.modal-card header p {
  margin: 0;
  color: #fff4d6;
  font-weight: 900;
  text-shadow: 0 2px 4px rgba(0,0,0,.3);
}

.close {
  width: 44px;
  height: 44px;
  background: rgba(255,255,255,.16);
  color: #fff4d6;
  font-size: 1.7rem;
}

.question-card h2,
.boss-card h3 {
  margin: 18px 18px 8px;
  font-size: clamp(1.35rem, 3vw, 2rem);
  line-height: 1.65;
  color: #3b281c;
  white-space: pre-line;
  word-break: break-word;
}

.answers {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
  margin: 16px 18px;
}

.answer-button {
  min-height: 66px;
  padding: 12px;
  background:
    linear-gradient(180deg, #fff8d9, #f3c970);
  border: 2px solid rgba(111, 73, 32, .3);
  color: var(--ink);
  box-shadow: 0 7px 0 rgba(124, 78, 32, .28), 0 12px 18px rgba(93, 56, 24, .12);
}

.answer-button:hover,
.answer-button:focus-visible {
  transform: translateY(-2px);
  background: linear-gradient(180deg, #fffce8, #ffd976);
  outline: 3px solid rgba(255, 235, 145, .7);
}

.fill-row {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) 120px;
  gap: 10px;
}

.fill-row input {
  min-height: 58px;
  border: 2px solid rgba(111, 73, 32, .3);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 1.3rem;
  background: rgba(255, 252, 238, .95);
}

.fill-row .primary {
  width: 100%;
  margin: 0;
  box-shadow: 0 7px 0 rgba(124, 78, 32, .28), 0 12px 18px rgba(93, 56, 24, .12);
}

.number-pad {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 8px;
  margin: 10px 18px 14px;
}

.number-pad button {
  min-height: 52px;
  background: linear-gradient(180deg, #eaf8ed, #a8d9bf);
  border: 2px solid rgba(38, 108, 75, .22);
  color: var(--ink);
}

.feedback {
  min-height: 28px;
  margin: 0 18px 14px;
  font-weight: 900;
}

.feedback.good { color: var(--green); }
.feedback.bad { color: var(--red); }

.reward-card {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 18px 14px;
  padding: 12px;
  border-radius: 8px;
  background:
    radial-gradient(circle at 16% 50%, rgba(255, 238, 128, .62), transparent 34%),
    linear-gradient(180deg, #fff6d8, #e6b85d);
  border: 2px solid rgba(117, 75, 29, .28);
  box-shadow: 0 12px 24px rgba(80, 48, 18, .18);
}

.reward-card img {
  width: 70px;
  height: 70px;
  object-fit: contain;
  filter: drop-shadow(0 8px 8px rgba(0,0,0,.22));
}

.reward-card span {
  display: block;
  color: #6c4a22;
  font-weight: 900;
}

.reward-card b {
  display: block;
  color: #2e2117;
  font-size: 1.5rem;
}

.battle-scene {
  position: relative;
  overflow: hidden;
  height: min(74vh, 760px);
  min-height: 560px;
  border-radius: 0;
  background:
    radial-gradient(circle at 50% 62%, rgba(255, 219, 108, .26), transparent 28%),
    linear-gradient(rgba(255,255,255,.04), rgba(15,25,37,.24)),
    url("assets/generated/math-islands-map.png") center / cover;
  touch-action: none;
}

.battle-scene.whack-mode {
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(11, 65, 88, .08)),
    url("assets/generated/decimal-whack-arena.png") center / cover;
  cursor: none;
}

.battle-scene.time-boss-mode {
  background:
    linear-gradient(180deg, rgba(8, 17, 43, .04), rgba(9, 21, 35, .2)),
    url("assets/generated/time-boss-arena.png") center / cover;
}

.battle-scene.time-boss-mode .arena-player {
  width: clamp(70px, 7vw, 108px);
  height: clamp(70px, 7vw, 108px);
  z-index: 7;
}

.battle-scene.time-boss-mode .arena-boss {
  width: clamp(126px, 14vw, 190px);
  height: clamp(126px, 14vw, 190px);
  z-index: 6;
}

.battle-scene.time-boss-mode .arena-boss.aging img {
  animation: timeBossAging .58s ease-out;
}

.time-tower-layer {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

.time-tower {
  position: absolute;
  width: clamp(128px, 13vw, 210px);
  height: clamp(150px, 16vw, 250px);
  border: 0;
  border-radius: 32% 32% 18% 18%;
  transform: translate(-50%, -58%);
  background: transparent;
  box-shadow: none;
  pointer-events: auto;
  cursor: pointer;
}

.time-tower::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 54%;
  width: 64%;
  height: 52%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 245, 151, .34), rgba(255, 218, 80, .16) 46%, transparent 72%);
  transform: translate(-50%, -50%);
  filter: blur(2px);
  animation: timeTowerGlow 1.05s ease-in-out infinite alternate;
}

.time-tower::after {
  content: "";
  position: absolute;
  inset: 4%;
  border-radius: inherit;
  border: 3px solid rgba(255, 239, 144, .34);
  opacity: 0;
  box-shadow: 0 0 36px rgba(255, 232, 118, .56);
  transition: opacity .18s ease, border-color .18s ease;
}

.time-tower.near {
  transform: translate(-50%, -58%) scale(1.04);
}

.time-tower.near::before {
  background: radial-gradient(circle, rgba(255, 255, 206, .58), rgba(255, 216, 69, .24) 46%, transparent 76%);
  filter: blur(1px);
}

.time-tower.near::after {
  opacity: 1;
  border-color: rgba(255, 248, 176, .74);
}

.time-tower.cooling {
  opacity: .72;
  animation: none;
}

.time-tower.cooling::before {
  inset: 4%;
  width: auto;
  height: auto;
  border-radius: inherit;
  background: rgba(72, 74, 78, .52);
  filter: none;
  transform: none;
  animation: none;
}

.time-tower.cooling::after {
  opacity: .72;
  border-color: rgba(190, 196, 202, .45);
  box-shadow: none;
}

.time-ritual-meter {
  position: absolute;
  z-index: 9;
  left: 18px;
  top: 58px;
  width: min(310px, calc(100% - 36px));
  padding: 12px 14px;
  border-radius: 8px;
  background: rgba(20, 38, 56, .78);
  color: #fff8df;
  font-weight: 900;
  box-shadow: 0 12px 24px rgba(0,0,0,.22);
}

.time-ritual-meter b,
.time-ritual-meter span {
  display: block;
}

.time-ritual-meter span {
  margin-top: 2px;
  color: #ffe08c;
}

.time-ritual-meter i {
  display: block;
  height: 12px;
  margin-top: 8px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(255,255,255,.16);
}

.time-ritual-meter em {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #7be6ff, #ffe177, #ffffff);
  transition: width .25s ease;
}

.time-pulse {
  position: absolute;
  z-index: 8;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.92), rgba(255,224,98,.42) 36%, transparent 68%);
  animation: timePulse .72s ease-out forwards;
}

.time-victory {
  position: absolute;
  inset: 0;
  z-index: 14;
  display: grid;
  place-items: center;
  pointer-events: none;
  background: radial-gradient(circle at 50% 44%, rgba(255, 245, 168, .22), rgba(8, 24, 42, .28));
}

.time-victory section {
  position: relative;
  z-index: 2;
  width: min(680px, calc(100% - 36px));
  aspect-ratio: 16 / 10;
  display: grid;
  align-content: center;
  padding: clamp(70px, 10vw, 116px) clamp(82px, 13vw, 150px);
  border: 0;
  border-radius: 14px;
  background: url("assets/generated/victory-scroll-book.png") center / 100% 100% no-repeat;
  color: #3b281c;
  text-align: center;
  box-shadow: 0 24px 58px rgba(5, 22, 37, .42);
  animation: victoryCardPop .34s ease-out;
}

.time-victory h3 {
  margin: 0 0 8px;
  color: #422813;
  font-size: clamp(2rem, 5vw, 3.5rem);
  text-shadow: 0 2px 0 rgba(255, 244, 184, .74), 0 8px 18px rgba(94, 58, 18, .18);
}

.time-victory p {
  margin: 0;
  color: #5b3517;
  font-weight: 900;
  font-size: clamp(1.1rem, 2.4vw, 1.45rem);
}

.arena-fireworks {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.arena-fireworks i {
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  background: #fff6a8;
  box-shadow:
    0 -56px 0 #fff6a8,
    40px -40px 0 #6ee7ff,
    56px 0 0 #ff6f6f,
    40px 40px 0 #8df07d,
    0 56px 0 #ffdc5f,
    -40px 40px 0 #75a8ff,
    -56px 0 0 #ff8fd2,
    -40px -40px 0 #ffffff;
  animation: arenaFireworkPop 1.05s ease-out infinite;
}

.arena-fireworks i:nth-child(1) { left: 18%; top: 24%; animation-delay: 0s; }
.arena-fireworks i:nth-child(2) { left: 80%; top: 22%; animation-delay: .12s; transform: scale(.82); }
.arena-fireworks i:nth-child(3) { left: 48%; top: 16%; animation-delay: .22s; transform: scale(1.12); }
.arena-fireworks i:nth-child(4) { left: 27%; top: 70%; animation-delay: .34s; transform: scale(.9); }
.arena-fireworks i:nth-child(5) { left: 74%; top: 72%; animation-delay: .46s; transform: scale(1.05); }
.arena-fireworks i:nth-child(6) { left: 10%; top: 54%; animation-delay: .58s; transform: scale(.72); }
.arena-fireworks i:nth-child(7) { left: 90%; top: 52%; animation-delay: .7s; transform: scale(.76); }

@keyframes arenaFireworkPop {
  0% { opacity: 0; transform: scale(.12); filter: blur(1px); }
  18% { opacity: 1; }
  78% { opacity: .92; }
  100% { opacity: 0; transform: scale(1.75); filter: blur(0); }
}

@keyframes victoryCardPop {
  from { opacity: 0; transform: translateY(18px) scale(.92); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes timeTowerGlow {
  from { opacity: .38; transform: translate(-50%, -50%) scale(.96); }
  to { opacity: .82; transform: translate(-50%, -50%) scale(1.08); }
}

@keyframes timePulse {
  from { opacity: 1; transform: translate(-50%, -50%) scale(.45) rotate(0deg); }
  to { opacity: 0; transform: translate(-50%, -50%) scale(2.5) rotate(90deg); }
}

@keyframes timeBossAging {
  0% { filter: brightness(1.8) drop-shadow(0 0 28px rgba(135, 226, 255, .9)); transform: scale(1.08); }
  100% { filter: brightness(1); transform: scale(1); }
}

.battle-scene.whack-mode .arena-player,
.battle-scene.whack-mode .arena-boss,
.battle-scene.whack-mode .arena-hint {
  display: none;
}

.battle-scene.whack-damaged {
  animation: whackDamage .28s ease-in-out 2;
}

.battle-scene.whack-empty {
  animation: whackEmpty .18s ease-out;
}

.battle-scene.whack-damaged::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255, 230, 124, .08), rgba(209, 45, 35, .22));
}

.whack-grid {
  position: absolute;
  z-index: 4;
  left: 50%;
  bottom: 5%;
  width: min(760px, 74%);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(14px, 2.3vw, 28px) clamp(22px, 3vw, 40px);
  transform: translateX(-50%);
}

.whack-cursor {
  position: absolute;
  z-index: 10;
  width: clamp(76px, 8vw, 112px);
  height: clamp(76px, 8vw, 112px);
  transform: translate(-34%, -72%) rotate(-26deg);
  pointer-events: none;
  filter: drop-shadow(0 12px 10px rgba(0,0,0,.34));
  transition: left .04s linear, top .04s linear;
}

.whack-cursor::before,
.whack-cursor::after {
  content: "";
  position: absolute;
  border-radius: 8px;
}

.whack-cursor::before {
  left: 12%;
  top: 8%;
  width: 76%;
  height: 28%;
  background: linear-gradient(180deg, #ffe2a0, #b56c34 58%, #704126);
  border: 2px solid rgba(82, 45, 24, .45);
}

.whack-cursor::after {
  left: 46%;
  top: 30%;
  width: 17%;
  height: 68%;
  background: linear-gradient(90deg, #6b3c24, #d59a55, #6b3c24);
  border: 2px solid rgba(82, 45, 24, .38);
}

.battle-scene.whack-empty .whack-cursor {
  animation: cursorHammerStrike .24s ease-out;
}

.whack-cursor.swing {
  animation: cursorHammerStrike .3s ease-out;
}

.whack-instruction,
.battle-instruction {
  position: absolute;
  inset: 0;
  z-index: 12;
  display: grid;
  place-items: center;
  padding: 22px;
  background: rgba(9, 33, 47, .45);
  backdrop-filter: blur(4px);
  cursor: default;
}

.whack-instruction section,
.battle-instruction section {
  width: min(520px, 100%);
  padding: 22px;
  border-radius: 8px;
  border: 3px solid rgba(255, 245, 198, .7);
  background:
    radial-gradient(circle at 20% 15%, rgba(255, 235, 128, .42), transparent 34%),
    linear-gradient(180deg, rgba(255, 248, 218, .96), rgba(231, 190, 103, .95));
  color: #3b281c;
  text-align: center;
  box-shadow: 0 24px 56px rgba(16, 38, 48, .42);
}

.whack-instruction h3,
.battle-instruction h3 {
  margin: 0 0 10px;
  font-size: clamp(1.8rem, 4vw, 2.7rem);
}

.whack-instruction p,
.battle-instruction p {
  margin: 8px 0;
  color: #3b281c;
  font-weight: 900;
  line-height: 1.6;
}

.whack-instruction .primary,
.battle-instruction .primary {
  width: min(260px, 100%);
  margin: 16px auto 0;
}

.time-boss-instruction section {
  width: min(520px, calc(100% - 28px));
  padding: 20px;
}

.time-rules {
  display: grid;
  gap: 8px;
  text-align: left;
}

.time-rules b,
.time-rules span {
  display: block;
  padding: 9px 11px;
  border-radius: 8px;
  background: rgba(255, 248, 216, .72);
  color: #3b281c;
  font-weight: 900;
  line-height: 1.35;
}

.time-rules b {
  text-align: center;
  background: linear-gradient(180deg, #fff2b8, #e6b85d);
}

.whack-hole {
  position: relative;
  height: clamp(96px, 13vh, 138px);
  border: 0;
  border-radius: 999px;
  background: transparent;
  overflow: visible;
  touch-action: manipulation;
}

.hole-shadow {
  position: absolute;
  left: 50%;
  bottom: 6%;
  width: 92%;
  height: 42%;
  border-radius: 50%;
  transform: translateX(-50%);
  background:
    radial-gradient(ellipse at 50% 52%, #2c1b19 0 43%, #6d4432 45% 62%, rgba(255, 214, 127, .16) 64% 72%, transparent 74%);
  box-shadow: inset 0 8px 18px rgba(0,0,0,.6), 0 8px 16px rgba(50, 24, 12, .32);
}

.hole-boss {
  position: absolute;
  left: 50%;
  bottom: 14%;
  width: 82%;
  height: 92%;
  transform: translate(-50%, 58%) scale(.72);
  opacity: 0;
  transition: transform .18s ease-out, opacity .16s ease-out;
  pointer-events: none;
  filter: drop-shadow(0 12px 10px rgba(0,0,0,.38));
}

.hole-boss img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.whack-hole.active .hole-boss {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
  animation: molePeek .34s ease-out;
}

.whack-hole.hit .hammer-hit {
  animation: hammerStrike .34s ease-out;
}

.whack-hole.hit .hole-boss img {
  animation: hitFlash .16s ease-in-out 2;
}

.whack-hole.boss-struck .hole-boss {
  opacity: 1;
  transform: translate(-50%, -5%) scale(1.08) rotate(-4deg);
}

.whack-hole.boss-struck .hole-boss img {
  animation: bossWhackHit .26s ease-out;
  filter: brightness(1.9) drop-shadow(0 0 28px rgba(255, 230, 94, .95));
}

.whack-hole.defeated .hole-boss {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
  animation: whackBossExplode 1s ease-out forwards;
}

.hammer-hit {
  position: absolute;
  z-index: 5;
  right: 8%;
  top: -4%;

function resetIsland(islandKey) {
  if (!state.unlockedIslands.includes(islandKey)) {
    missionLog.textContent = "這座島還沒解鎖，先打敗目前島嶼的 Boss。";
    return;
  }

  stopBattleLoop();
  stopFlightMode();
  stopTimeMode();
  closeTransientModals();
  state.island = islandKey;
  if (audio.enabled) startMusic();
  state.answered = [];
  state.correct = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.retryNeeded = 0;
  state.bossTauntShown = false;
  state.bossReadyMessageShown = false;
  state.rewards = [];
  state.currentQuestion = null;
  state.currentEvent = null;
  state.currentNode = null;
  state.battle = null;
  state.pendingNextIsland = null;
  clearTimeout(state.questionTimer);

  eventNodes.forEach((node) => {
    node.classList.remove("visited");
    node.disabled = false;
    node.setAttribute("aria-disabled", "false");
  });
  restoreEventNodes();
  heroImage.src = originalHeroSrc;

  islandButtons.forEach((button) => {
    const unlocked = state.unlockedIslands.includes(button.dataset.island);
    button.classList.toggle("active", button.dataset.island === islandKey);
    button.classList.toggle("locked", !unlocked);
    button.disabled = !unlocked;
  });

  bossMapIcon.src = getBossImage(islands[islandKey].theme);
  hideBossTaunt();
  moveHeroPercent(18, 63);
  missionLog.textContent = `已抵達${islands[islandKey].name}。答題取得裝備，答對 ${getChallengeTarget()} 題後挑戰 Boss。`;
  updateTutorialArrow();
  updateHud();
  if (islandKey === "decimal") {
    showGuideMessage(getIslandGuideMessage("decimal"), "開始飛行", () => startFlightMode());
  } else if (islandKey === "time") {
    showGuideMessage(getIslandGuideMessage("time"), "開始探索", () => startTimeMode());
  }
}

function closeTransientModals() {
  bossModal.classList.add("hidden");
  questionModal.classList.add("hidden");
  clearModal.classList.add("hidden");
  battleActions.classList.add("hidden");
  endBattle.classList.add("hidden");
  rewardCard.classList.add("hidden");
  nextQuestion.classList.add("hidden");
}

function getBossImage(theme) {
  return {
    rock: "assets/generated/boss-rock.png",
    lake: "assets/generated/boss-lake.png",
    clock: "assets/generated/boss-clock.png"
  }[theme];
}

function getAbility() {
  const accuracy = state.answered.length ? state.correct / state.answered.length : 0;
  const attackItems = state.rewards.filter((item) => item.kind === "attack");
  const bestAttack = Math.max(1, ...attackItems.map((item) => item.power));
  const crystals = state.rewards.filter((item) => item.id === "crystal").length;
  const hearts = state.rewards.filter((item) => item.id === "heart").length;
  const shields = state.rewards.filter((item) => item.id === "shield").length;
  const weapon = bestAttack >= 3 ? "星光劍" : bestAttack >= 2 ? "鐵劍" : "木劍";
  return {
    weapon,
    hp: 3 + hearts + Math.floor(shields / 2),
    attack: bestAttack + crystals,
    accuracy
  };
}

function updateHud() {
  const ability = getAbility();
  const target = getChallengeTarget();
  const progress = Math.min(1, state.correct / target);
  currentIsland.textContent = islands[state.island].name;
  answeredCount.textContent = `${state.correct} / ${target}`;
  correctCount.textContent = state.correct;
  weaponName.textContent = ability.weapon;
  progressText.textContent = `${Math.round(progress * 100)}%`;
  progressBar.style.width = `${progress * 100}%`;
  bossPreviewBar.style.width = `${Math.max(14, ability.accuracy * 100)}%`;
  hpPreview.textContent = ability.hp;
  attackPreview.textContent = ability.attack;
  comboPreview.textContent = state.combo;
  renderInventory();

  const ready = isBossReady();
  bossButton.disabled = !ready;
  bossButton.textContent = ready ? `挑戰${islands[state.island].boss}` : `答對 ${target} 題挑戰 Boss`;
  bossNode.classList.toggle("locked", !ready);
  if (ready) {
    showBossTauntOnce();
    showBossReadyMessage();
  }
}

function getChallengeTarget() {
  return state.retryNeeded || QUESTIONS_PER_ISLAND;
}

function getChallengeGoalText() {
  return state.retryNeeded
    ? `這次只要再答對 ${state.retryNeeded} 題，就能重新挑戰 Boss。`
    : `答對 ${QUESTIONS_PER_ISLAND} 題後，就能挑戰 Boss。`;
}

function getIslandGuideMessage(islandKey) {
  if (islandKey === "decimal") {
    return `${decimalIntroMessage}\n${getChallengeGoalText()}`;
  }
  if (islandKey === "time") {
    return `${timeIntroMessage}\n${getChallengeGoalText()}`;
  }
  return getChallengeGoalText();
}

function isBossReady() {
  return state.correct >= getChallengeTarget();
}

function updateTutorialArrow() {
  const show = state.island === "multiply" && !state.tutorialSeen && state.answered.length === 0;
  tutorialArrow.classList.toggle("hidden", !show);
}

function showBossTauntOnce() {
  if (state.bossTauntShown || !bossTaunt) return;
  state.bossTauntShown = true;
  bossTauntName.textContent = islands[state.island].boss;
  bossTaunt.querySelector("span").textContent = state.retryNeeded ? "再來挑戰我！" : "來找我決鬥！";
  bossTaunt.classList.remove("hidden");
  window.setTimeout(() => bossTaunt.classList.add("hidden"), 5200);
}

function showBossReadyMessage() {
  if (state.bossReadyMessageShown) return;

  missionLog.textContent = state.island === "time"

function toggleSound() {
  audio.enabled = !audio.enabled;
  if (audio.enabled) {
    audio.unlocked = true;
    startMusic();
  } else {
    audio.unlocked = false;
    stopMusic();
  }
  updateSoundButton();
}

function updateSoundButton() {
  if (!soundToggle) return;
  soundToggle.textContent = audio.enabled ? "🔊" : "🔇";
  soundToggle.classList.toggle("on", audio.enabled);
  soundToggle.setAttribute("aria-label", audio.enabled ? "關閉音樂" : "開啟音樂");
}

function startMusic() {
  if (!audio.enabled) return;
  const src = getMusicSrcForIsland(state.island);
  if (!audio.player) {
    audio.player = new Audio();
    audio.player.loop = true;
    audio.player.preload = "auto";
  }
  if (audio.currentSrc !== src) {
    audio.player.pause();
    audio.player.src = src;
    audio.currentSrc = src;
  }
  audio.player.volume = audio.volume;
  audio.player.play().catch(() => {
    audio.unlocked = false;
    updateSoundButton();
  });
}

function stopMusic() {
  audio.player?.pause();
}

function getMusicSrcForIsland(islandKey) {

    multiply: "sounds/1.mp3",
    decimal: "sounds/2.mp3",
    time: "sounds/3.mp3"

}

function stopTimeMode() {
  if (state.time?.frameId) cancelAnimationFrame(state.time.frameId);
  state.time = null;
  heldTimeMoves.clear();
  mapArt.classList.remove("time-mode");
  flightControls?.classList.add("hidden");
}

function pauseTimeMode() {
  if (!state.time) return;
  state.time.paused = true;
}

function resumeTimeMode() {
  if (!state.time || state.island !== "time") return;
  state.time.paused = false;
  state.time.opening = false;
  state.time.lastFrame = performance.now();
}

function configureTimeNodes() {
  eventNodes.forEach((node, index) => {
    const img = node.querySelector("img");
    node.dataset.event = "treasure";
    if (img) img.src = "assets/generated/prop-treasure.png";
    node.classList.toggle("time-hidden-node", index >= 8);
    node.disabled = index >= 8;
    node.setAttribute("aria-disabled", index >= 8 ? "true" : "false");
  });
}

function restoreEventNodes() {
  originalNodeData.forEach(({ node, event, src }) => {
    node.dataset.event = event;
    node.classList.remove("time-hidden-node");
    const img = node.querySelector("img");
    if (img && src) img.src = src;
  });
}

function runTimeFrame(now) {
  const time = state.time;
  if (!time || !time.active) return;
  const dt = Math.min(40, now - time.lastFrame) / 16.67;
  time.lastFrame = now;
  if (!time.paused) {
    updateTimeMovement(dt);
    checkTimeChestProximity();
  }
  time.frameId = requestAnimationFrame(runTimeFrame);
}

function updateTimeMovement(dt) {
  if (!heldTimeMoves.size) {
    hero.classList.remove("walking");
    return;
  }
  const pos = getHeroPercent();
  const speed = 0.34 * dt;
  let dx = 0;
  let dy = 0;
  if (heldTimeMoves.has("left")) dx -= 1;
  if (heldTimeMoves.has("right")) dx += 1;
  if (heldTimeMoves.has("up")) dy -= 1;
  if (heldTimeMoves.has("down")) dy += 1;
  if (dx && dy) {
    dx *= 0.707;
    dy *= 0.707;
  }
  const next = getTimeWalkTarget(pos, dx * speed, dy * speed);
  if (!next.moved) {
    hero.classList.remove("walking");
    return;
  }
  hero.style.left = `${next.x}%`;
  hero.style.top = `${next.y}%`;
  hero.classList.add("walking");
  if (dx < -0.05) hero.classList.add("face-left");
  if (dx > 0.05) hero.classList.remove("face-left");
}

function getTimeWalkTarget(pos, moveX, moveY) {
  const direct = {
    x: clamp(pos.x + moveX, 6, 88),
    y: clamp(pos.y + moveY, 15, 91)
  };
  if (isTimeWalkable(direct.x, direct.y)) return { ...direct, moved: true };

  const horizontal = { x: clamp(pos.x + moveX, 6, 88), y: pos.y };
  if (Math.abs(moveX) > 0.01 && isTimeWalkable(horizontal.x, horizontal.y)) {
    return { ...horizontal, moved: true };
  }

  const vertical = { x: pos.x, y: clamp(pos.y + moveY, 15, 91) };
  if (Math.abs(moveY) > 0.01 && isTimeWalkable(vertical.x, vertical.y)) {
    return { ...vertical, moved: true };
  }

  return { ...pos, moved: false };
}

function loadTimeWalkMask() {
  if (timeWalkMask.ready || timeWalkMask.loading) return;
  timeWalkMask.loading = true;
  const image = new Image();
  image.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = image.naturalWidth || image.width;
    canvas.height = image.naturalHeight || image.height;
    const context = canvas.getContext("2d", { willReadFrequently: true });
    context.drawImage(image, 0, 0);
    timeWalkMask.image = image;
    timeWalkMask.canvas = canvas;
    timeWalkMask.context = context;
    timeWalkMask.ready = true;
    timeWalkMask.loading = false;
  };
  image.onerror = () => {
    timeWalkMask.loading = false;
  };
  image.src = "assets/generated/time-garden-map.png";
}

function isTimeWalkable(x, y) {
  if (timeWalkMask.ready && timeWalkMask.context) {
    try {
      return isTimeLandPixel(x, y);
    } catch (error) {
      timeWalkMask.ready = false;
    }
  }
  const zones = [
    { x: 17, y: 67, rx: 15, ry: 16 },
    { x: 29, y: 36, rx: 16, ry: 15 },
    { x: 43, y: 54, rx: 22, ry: 18 },
    { x: 56, y: 73, rx: 22, ry: 14 },
    { x: 67, y: 40, rx: 18, ry: 18 },
    { x: 75, y: 65, rx: 13, ry: 15 },
    { x: 58, y: 24, rx: 14, ry: 11 }
  ];
  return zones.some((zone) => {
    const nx = (x - zone.x) / zone.rx;
    const ny = (y - zone.y) / zone.ry;
    return nx * nx + ny * ny <= 1;
  });
}

function isTimeLandPixel(x, y) {
  const { canvas, context } = timeWalkMask;
  const px = clamp(Math.round((x / 100) * canvas.width), 0, canvas.width - 1);
  const py = clamp(Math.round((y / 100) * canvas.height), 0, canvas.height - 1);
  let landSamples = 0;
  let waterSamples = 0;

  for (let offsetY = -3; offsetY <= 3; offsetY += 3) {
    for (let offsetX = -3; offsetX <= 3; offsetX += 3) {
      const sx = clamp(px + offsetX, 0, canvas.width - 1);
      const sy = clamp(py + offsetY, 0, canvas.height - 1);
      const [r, g, b] = context.getImageData(sx, sy, 1, 1).data;
      if (isWaterColor(r, g, b)) waterSamples += 1;
      else landSamples += 1;
    }
  }

  return landSamples >= 5 && waterSamples <= 3;
}

function isWaterColor(r, g, b) {
  return b > 105 && g > 85 && b > r * 1.55 && g > r * 1.25;
}

function checkTimeChestProximity() {
  if (!state.time || state.time.opening || isBossReady()) return;
  const heroPos = getHeroPercent();
  const target = eventNodes.find((node) => {
    if (node.classList.contains("visited") || node.classList.contains("time-hidden-node")) return false;
    const pos = getNodePercent(node);
    return Math.hypot(pos.x - heroPos.x, pos.y - heroPos.y) < 8.5;
  });
  if (!target) return;
  state.time.opening = true;
  pauseTimeMode();
  state.currentNode = target;
  window.setTimeout(() => openQuestion("treasure"), 220);
}

function getNodePercent(element) {
  const nodeRect = element.getBoundingClientRect();
  const mapRect = mapArt.getBoundingClientRect();
  return {
    x: ((nodeRect.left - mapRect.left + nodeRect.width / 2) / mapRect.width) * 100,
    y: ((nodeRect.top - mapRect.top + nodeRect.height / 2) / mapRect.height) * 100
  };
}

function pauseFlightMode() {
  if (!state.flight) return;
  state.flight.paused = true;
  mapArt.classList.add("flight-paused");
}

function resumeFlightMode() {
  if (!state.flight || state.island !== "decimal") return;
  state.flight.paused = false;
  mapArt.classList.remove("flight-paused");
  state.flight.lastFrame = performance.now();
}

function runFlightFrame(now) {
  const flight = state.flight;
  if (!flight || !flight.active) return;
  const dt = Math.min(40, now - flight.lastFrame) / 16.67;
  flight.lastFrame = now;

  if (!flight.paused) {
    updateFlightControlMovement(dt);
    if (now - flight.lastSpawn > 1060) {
      spawnFlightObject();
      flight.lastSpawn = now;
    }
    updateFlightObjects(dt);
  }

  flight.frameId = requestAnimationFrame(runFlightFrame);
}

function updateFlightControlMovement(dt) {
  if (!heldFlightMoves.size) return;
  const pos = getHeroPercent();
  const speed = 0.82 * dt;
  let dx = 0;
  let dy = 0;
  if (heldFlightMoves.has("left")) dx -= 1;
  if (heldFlightMoves.has("right")) dx += 1;
  if (heldFlightMoves.has("up")) dy -= 1;
  if (heldFlightMoves.has("down")) dy += 1;
  if (dx && dy) {
    dx *= 0.707;
    dy *= 0.707;
  }
  hero.style.left = `${clamp(pos.x + dx * speed, 8, 92)}%`;
  hero.style.top = `${clamp(pos.y + dy * speed, 16, 84)}%`;
}

function spawnFlightObject() {
  if (!state.flight || isBossReady()) return;
  const roll = Math.random();
  const kind = roll < 0.48 ? "question" : roll < 0.76 ? "reward" : "monster";
  const el = document.createElement("button");
  el.type = "button";
  el.className = `flight-object ${kind}`;
  el.setAttribute("aria-label", kind === "question" ? "數學題" : kind === "reward" ? "寶物" : "怪物");
  if (kind === "question") el.innerHTML = `<img src="assets/generated/flight-question-scroll.png" alt="">`;
  if (kind === "reward") el.innerHTML = `<img src="${randomRewardIcon()}" alt="">`;
  if (kind === "monster") el.innerHTML = `<img src="assets/generated/boss-lake.png" alt="">`;
  const obj = {
    kind,
    el,
    x: 108,
    y: 18 + Math.random() * 66,
    speed: kind === "monster" ? 0.45 + Math.random() * 0.2 : 0.34 + Math.random() * 0.18,
    radius: kind === "monster" ? 5.8 : 4.8
  };
  el.style.left = `${obj.x}%`;
  el.style.top = `${obj.y}%`;
  mapArt.append(el);
  state.flight.objects.push(obj);
}

function randomRewardIcon() {
  const ids = ["woodSword", "ironSword", "heart", "shield", "crystal", "starSword"];
  return rewardTypes[ids[Math.floor(Math.random() * ids.length)]].icon;
}

function updateFlightObjects(dt) {
  const flight = state.flight;
  if (isBossReady()) {
    clearFlightObjects();
    flight.objects = [];
    bossNode.disabled = false;
    bossNode.setAttribute("aria-disabled", "false");
    missionLog.textContent = `小數湖已答對 ${getChallengeTarget()} 題，可以挑戰${islands[state.island].boss}。`;
    return;
  }
  const heroPos = getHeroPercent();
  flight.objects.forEach((obj) => {
    obj.x -= obj.speed * dt;
    obj.el.style.left = `${obj.x}%`;
    if (Math.hypot(obj.x - heroPos.x, obj.y - heroPos.y) < obj.radius + 5) {
      handleFlightCollision(obj);
      obj.dead = true;
    }
  });
  flight.objects = flight.objects.filter((obj) => {
    const alive = !obj.dead && obj.x > -10;
    if (!alive) obj.el.remove();
    return alive;
  });
}

function handleFlightCollision(obj) {
  if (obj.kind === "question") {
    pauseFlightMode();
    openQuestion("question");
    return;
  }
  if (obj.kind === "reward") {
    const reward = grantReward();
    playSfx("reward");
    missionLog.textContent = `空中取得 ${reward.name}！`;
    updateHud();
    return;
  }
  if (consumeMonsterShield()) {
    playSfx("shield");
    missionLog.textContent = "寶物擋住怪物了！少一個寶物，但答對數不會減少。";
    showFlightWarning("寶物擋住了！", "消耗 1 個寶物");
    hero.classList.add("hit");
    window.setTimeout(() => hero.classList.remove("hit"), 360);
    return;
  }
  state.flight.monsterHits = (state.flight.monsterHits || 0) + 1;
  if (state.flight.monsterHits >= 2) {
    playSfx("hit");
    state.flight.monsterHits = 0;
    state.correct = Math.max(0, state.correct - 1);
    missionLog.textContent = "連續撞到 2 隻怪物，少 1 題答對數。";
    showFlightWarning("被怪物干擾！", "答對數 -1");
    updateHud();
  } else {
    playSfx("hit");
    missionLog.textContent = "小心！再撞到 1 隻怪物會少 1 題答對數。";
    showFlightWarning("撞到怪物！", "再撞一次會扣答對數");
  }
  state.combo = 0;
  hero.classList.add("hit");
  window.setTimeout(() => hero.classList.remove("hit"), 360);
}

function consumeMonsterShield() {
  if (!state.rewards.length) return false;
  state.rewards.pop();
  updateHud();
  return true;
}

function showFlightWarning(title, detail) {
  let alert = mapArt.querySelector(".flight-alert");
  if (!alert) {
    alert = document.createElement("div");
    alert.className = "flight-alert";
    mapArt.append(alert);
  }
  alert.innerHTML = `<b>${title}</b><span>${detail}</span>`;
  alert.classList.remove("show");
  mapArt.classList.remove("flight-hit");
  void alert.offsetWidth;
  alert.classList.add("show");
  mapArt.classList.add("flight-hit");
  window.setTimeout(() => {
    alert.classList.remove("show");
    mapArt.classList.remove("flight-hit");
  }, 1050);
}

function clearFlightObjects() {
  mapArt.querySelectorAll(".flight-object").forEach((el) => el.remove());
  mapArt.querySelectorAll(".flight-alert").forEach((el) => el.remove());
  mapArt.classList.remove("flight-hit");
}

function getHeroPercent() {
  return {
    x: parseFloat(hero.style.left) || 18,

  };
}

function renderInventory() {

function moveHeroPercent(x, y) {
  hero.style.left = `${x}%`;
  hero.style.top = `${y}%`;
  hero.classList.add("moving");
  window.setTimeout(() => hero.classList.remove("moving"), 560);
}

function moveHeroToElement(element) {
  const { x, y } = getNodePercent(element);
  moveHeroPercent(x, y);
}

function pickQuestion() {
  if (Math.random() < 0.12) return makeRandomQuestion(state.island);
  const pool = islands[state.island].questions.filter(isPlayableQuestion);
  const unused = pool.map((question, index) => ({ question, index })).filter((item) => !state.answered.includes(item.index));
  const picked = !unused.length
    ? { question: pool[Math.floor(Math.random() * pool.length)], index: -1 }
    : unused[Math.floor(Math.random() * unused.length)];
  return normalizeQuestionForPlay({ ...picked.question, __sourceIndex: picked.index });
}

function isPlayableQuestion(question) {
  const prompt = String(question.prompt);
  const unplayablePatterns = [
    /下表/,
    /下圖/,
    /看表/,
    /時刻表/,
    /現在是\(\s*\)時\(\s*\)分，還差\(\s*\)分鐘/,
    /現在是\(\s*\)時\(\s*\)分，\d+分鐘前是\(\s*\)時\(\s*\)分/,
    /現在是上午，上一班公車/,
    /電影就要開演了，電影開演的時刻/,
    /爸爸到達張伯伯家剛好是10時50分/
  ];
  return !unplayablePatterns.some((pattern) => pattern.test(prompt));
}

function choiceQuestion(prompt, answer, wrongs, explain) {
  return { type: "choice", prompt, choices: [...wrongs, answer].sort(() => Math.random() - 0.5), answer, explain };
}

function normalizeQuestionForPlay(question) {
  if (question.type !== "fill") return question;
  const reading = normalizeReadingQuestion(question);
  if (reading) return reading;
  const comparison = normalizeComparisonSymbolQuestion(question);
  if (comparison) return comparison;
  const yesNo = normalizeYesNoQuestion(question);
  if (yesNo) return yesNo;
  const divisionRemainder = normalizeDivisionRemainderQuestion(question);
  if (divisionRemainder) return divisionRemainder;
  const labeled = normalizeLabeledOptionQuestion(question);
  if (labeled) return labeled;
  const multipleAnswer = normalizeMultipleAnswerQuestion(question);
  if (multipleAnswer) return multipleAnswer;
  if (isSingleAlternativeQuestion(question)) {
    const accepted = getAcceptedAnswers(question);
    if (accepted.length >= 2 && accepted.length <= 4) {
      return {
        ...question,
        type: "choice",
        answer: accepted[0],
        acceptedAnswers: accepted,
        choices: buildAlternativeChoices(accepted).sort(() => Math.random() - 0.5)
      };
    }
  }
  if (!shouldUseChoiceForTextAnswer(question)) return question;
  const answer = String(question.answer).trim();
  const choices = buildTextChoices(question, answer);
  if (choices.length < 2) return question;
  return {
    ...question,
    type: "choice",
    answer,
    choices: [...new Set([answer, ...choices])].slice(0, 4).sort(() => Math.random() - 0.5)
  };
}

function normalizeReadingQuestion(question) {
  const prompt = String(question.prompt);
  if (!/正確讀法/.test(prompt)) return null;
  const answer = String(question.answer).trim();
  const choices = buildReadingChoices(answer);
  return {
    ...question,
    type: "choice",
    answer,
    choices: choices.sort(() => Math.random() - 0.5)
  };
}

function buildReadingChoices(answer) {
  const digits = ["一", "二", "三", "四", "五", "六", "七", "八", "九"];
  const choices = [answer];
  digits.forEach((digit) => {
    const candidate = answer.replace(/[一二三四五六七八九]$/, digit);
    if (!choices.includes(candidate) && choices.length < 4) choices.push(candidate);
  });
  return choices;
}

function normalizeComparisonSymbolQuestion(question) {
  if (!/填入[＞><＜=＝]/.test(String(question.prompt))) return null;
  const answer = normalizeComparisonSymbol(question.answer);
  if (!answer) return null;
  return {
    ...question,
    type: "choice",
    answer,
    choices: ["＞", "＜", "＝"],
    explain: `答案是 ${answer}。`
  };
}

function normalizeComparisonSymbol(value) {
  const text = String(value).replace(/[\uFF0C,\u3001\s]/g, "");
  if (/[＞>]/.test(text)) return "＞";
  if (/[＜<]/.test(text)) return "＜";
  if (/[=＝]/.test(text)) return "＝";
  return "";
}

function normalizeYesNoQuestion(question) {
  const prompt = String(question.prompt);
  if (!/[嗎?？]/.test(prompt)) return null;
  const answer = String(question.answer).trim();
  const yesAnswers = ["是", "可以", "一樣久", "會", "有"];
  const noAnswers = ["不是", "不可以", "不一樣久", "不會", "沒有"];
  if (![...yesAnswers, ...noAnswers].includes(answer)) return null;
  const choices = answer.includes("一樣久")
    ? ["一樣久", "不一樣久"]
    : yesAnswers.includes(answer) ? [answer, "不是"] : ["是", answer];
  return {
    ...question,
    type: "choice",
    answer,
    choices: [...new Set(choices)],
    explain: question.explain || `答案是 ${answer}。`
  };
}

function normalizeDivisionRemainderQuestion(question) {
  const prompt = String(question.prompt);
  const match = prompt.match(/根據算式，填填看。(\d+)÷(\d+)＝(\d+)…(\d+)\1－\4＝\(\s*\)×\(\s*\)/);
  if (!match) return null;
  const [, dividend, divisor, quotient, remainder] = match;
  return {
    ...question,
    prompt: `根據算式，填填看。\n${dividend}÷${divisor}＝${quotient}…${remainder}\n${dividend}－${remainder}＝( ) × ( )`,
    answer: [divisor, quotient],
    anyOrderAnswers: [divisor, quotient],
    explain: `詳解：把餘數 ${remainder} 扣掉，${dividend}－${remainder}＝${Number(dividend) - Number(remainder)}，也就是 ${divisor}×${quotient}。兩格可填 ${divisor}、${quotient}，順序可互換。`
  };
}

function normalizeMultipleAnswerQuestion(question) {
  const prompt = String(question.prompt);
  if (!/有哪些/.test(prompt)) return null;
  const answers = getAcceptedAnswers(question);
  if (answers.length < 2) return null;
  return {
    ...question,
    answer: answers[0],
    suffix: "",
    anyOrderAnswers: answers,
    explain: question.explain || `答案是 ${answers.join("、")}。`
  };
}

function normalizeLabeledOptionQuestion(question) {
  const prompt = String(question.prompt);
  if (!/哪些可能/.test(prompt) || !/[甲乙丙丁]：/.test(prompt)) return null;
  const answer = String(question.answer).trim();
  const options = [...new Set([answer, ...buildLabeledAnswerChoices(prompt, answer)])].slice(0, 4);
  if (options.length < 2) return null;
  return {
    ...question,
    type: "choice",
    answer,
    acceptedAnswers: [answer],
    choices: options.sort(() => Math.random() - 0.5),
    explain: question.explain || `答案是 ${answer}。`
  };
}

function buildLabeledAnswerChoices(prompt, answer) {
  const labels = [...prompt.matchAll(/([甲乙丙丁])：/g)].map((match) => match[1]);
  const choices = [];
  labels.forEach((label) => {
    if (label !== answer) choices.push(label);
  });
  for (let i = 0; i < labels.length; i += 1) {
    for (let j = i + 1; j < labels.length; j += 1) {
      const pair = `${labels[i]}、${labels[j]}`;
      if (pair !== answer) choices.push(pair);
    }
  }
  return choices;
}

function buildAlternativeChoices(accepted) {
  const choices = [...new Set(accepted.map(String))];
  for (let digit = 0; choices.length < 4 && digit <= 9; digit += 1) {
    const value = String(digit);
    if (!choices.includes(value)) choices.push(value);
  }
  return choices.slice(0, 4);
}

function shouldUseChoiceForTextAnswer(question) {
  const answer = String(question.answer).trim();
  return /[\u4e00-\u9fff]/.test(answer) && /誰|哪一|哪個|哪一個|哪一班|比較多|比較大|比較久|比較長|最多|最少|最大|最小/.test(question.prompt);
}

function buildTextChoices(question, answer) {
  const prompt = String(question.prompt);
  if (/宥希|詠安/.test(prompt)) return ["宥希", "詠安", "一樣多", "無法比較"];
  if (/甲班|乙班/.test(prompt)) return ["甲", "乙", "一樣多", "無法比較"];
  if (/上班|下班/.test(prompt)) return ["上班", "下班", "一樣多", "無法比較"];
  const names = [...prompt.matchAll(/[\u4e00-\u9fff]{2,4}(?=喝了|花了|：|班|和)/g)].map((match) => match[0]);
  return [...new Set([answer, ...names, "一樣多", "無法比較"])];
}

function makeRandomQuestion(islandKey) {
  if (islandKey === "multiply") return makeMultiplyQuestion();
  if (islandKey === "decimal") return makeDecimalQuestion();
  return makeTimeQuestion();
}

function makeMultiplyQuestion() {
  const mode = Math.floor(Math.random() * 3);
  if (mode === 0) {
    const a = 4 + Math.floor(Math.random() * 9);
    const b = 3 + Math.floor(Math.random() * 9);
    const ans = a * b;
    return choiceQuestion(`${a} 盒鉛筆，每盒 ${b} 枝，共有幾枝？`, `${ans} 枝`, [`${ans + b} 枝`, `${ans - b} 枝`, `${a + b} 枝`], `${a} × ${b} = ${ans}。`);
  }
  if (mode === 1) {
    const b = 3 + Math.floor(Math.random() * 9);
    const ans = 4 + Math.floor(Math.random() * 12);
    const total = b * ans;
    return { type: "fill", prompt: `${total} 顆糖果，每 ${b} 顆裝一袋，可以裝幾袋？`, answer: `${ans}`, suffix: "袋", explain: `${total} ÷ ${b} = ${ans}。` };
  }
  const people = 3 + Math.floor(Math.random() * 7);
  const each = 5 + Math.floor(Math.random() * 9);
  const total = people * each;
  return choiceQuestion(`${total} 張貼紙平分給 ${people} 人，每人幾張？`, `${each} 張`, [`${each + 1} 張`, `${each + 2} 張`, `${Math.max(1, each - 1)} 張`], `${total} ÷ ${people} = ${each}。`);
}

function makeDecimalQuestion() {
  const mode = Math.floor(Math.random() * 4);
  const oneDecimal = (n) => (Math.round(n * 10) / 10).toString();
  if (mode === 0) {
    const a = (10 + Math.floor(Math.random() * 70)) / 10;
    const b = (5 + Math.floor(Math.random() * 30)) / 10;
    const ans = oneDecimal(a + b);
    return choiceQuestion(`${a} + ${b} = ?`, ans, [oneDecimal(a + b + 0.1), oneDecimal(a + b - 0.2), oneDecimal(a + b + 1)], `${a} + ${b} = ${ans}。`);
  }
  if (mode === 1) {
    const b = (5 + Math.floor(Math.random() * 25)) / 10;
    const ans = (5 + Math.floor(Math.random() * 45)) / 10;
    const a = oneDecimal(ans + b);
    return { type: "fill", prompt: `${a} - ${b} = ?`, answer: oneDecimal(Number(a) - b), explain: `${a} - ${b} = ${oneDecimal(Number(a) - b)}。` };
  }
  if (mode === 2) {
    const a = [0.25, 0.5, 1.5, 2.5][Math.floor(Math.random() * 4)];
    const b = 2 + Math.floor(Math.random() * 4);
    const ans = oneDecimal(a * b).replace(".0", "");
    return { type: "fill", prompt: `${a} × ${b} = ?`, answer: ans, explain: `${a} × ${b} = ${ans}。` };
  }
  const values = [Math.random(), Math.random(), Math.random(), Math.random()].map((v) => (Math.round(v * 100) / 100).toFixed(2));
  const answer = values.slice().sort((a, b) => Number(b) - Number(a))[0];
  return choiceQuestion("哪一個小數最大？", answer, values.filter((v) => v !== answer).slice(0, 3), `比較整數位、十分位、百分位，最大的是 ${answer}。`);
}

function makeTimeQuestion() {
  const mode = Math.floor(Math.random() * 3);
  const hour = 7 + Math.floor(Math.random() * 5);
  const minute = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50][Math.floor(Math.random() * 11)];
  const add = [20, 25, 30, 35, 40, 45, 50, 60, 75][Math.floor(Math.random() * 9)];
  const total = hour * 60 + minute + add;
  const endHour = Math.floor(total / 60);
  const endMinute = total % 60;
  const end = `${endHour}:${String(endMinute).padStart(2, "0")}`;
  if (mode === 0) {
    return { type: "fill", prompt: `${hour}:${String(minute).padStart(2, "0")} 再過 ${add} 分，是幾點？請輸入 ${end} 這種格式。`, answer: end, explain: `把 ${add} 分加上去，得到 ${end}。` };
  }
  if (mode === 1) {
    return choiceQuestion(`從 ${hour}:${String(minute).padStart(2, "0")} 到 ${end}，經過多久？`, `${add} 分`, [`${add - 5} 分`, `${add + 5} 分`, `${add + 10} 分`], `結束時間減開始時間，經過 ${add} 分。`);
  }
  const h = 1 + Math.floor(Math.random() * 3);
  const m = [5, 10, 15, 20, 25, 30, 40, 45, 50][Math.floor(Math.random() * 9)];
  return { type: "fill", prompt: `${h} 小時 ${m} 分 = 幾分鐘？`, answer: `${h * 60 + m}`, suffix: "分鐘", explain: `${h} 小時是 ${h * 60} 分，再加 ${m} 分。` };
}

function eventLabel(eventName) {
  return { treasure: "寶箱", bridge: "橋", door: "門", npc: "NPC", question: "飛行題" }[eventName] || "挑戰";
}

function openQuestion(eventName) {
  if (isBossReady()) {
    missionLog.textContent = `已答對 ${getChallengeTarget()} 題，可以挑戰${islands[state.island].boss}。`;
    return;
  }

  playSfx("open");
  const question = pickQuestion();
  state.currentQuestion = question;
  state.currentEvent = eventName;
  questionTitle.textContent = `${islands[state.island].name} - ${eventLabel(eventName)}`;
  questionText.textContent = formatPrompt(question.prompt);
  feedback.textContent = "";
  feedback.className = "feedback";
  rewardCard.classList.add("hidden");
  nextQuestion.classList.add("hidden");

  questionModal.classList.remove("hidden");
}

function markCurrentNodeVisited() {
  if (!state.currentNode) return;
  state.currentNode.classList.add("visited");
  state.currentNode.disabled = true;
  state.currentNode.setAttribute("aria-disabled", "true");
  state.currentNode = null;
}

function normalizeAnswer(value) {
  return String(value).trim().replace(/[\uFF0C\u3001]/g, ",").replace(/\s+/g, "").replace("：", ":");
}

function formatPrompt(prompt) {
  return splitJoinedEquations(String(prompt))
    .replace(/(上面\d+個算式)/g, "\n$1")
    .replace(/(想想看，)/g, "\n$1")
    .replace(/；/g, "；\n")
    .replace(/。(?=\S)/g, "。\n")
    .replace(/\)(?=\S)/g, ")\n")
    .replace(/([？?。])(?=\S)/g, "$1\n")
    .replace(/([，,])(?=\S)/g, "$1\n");
}

function splitJoinedEquations(prompt) {
  let text = prompt
    .replace(/＝□(?=\d+[×÷+\-])/g, "＝□\n")
    .replace(/＝■(?=\d+[×÷+\-])/g, "＝■\n")
    .replace(/(÷■＝5)(?=5×■)/g, "$1\n")
    .replace(/(＝□)(?=上面)/g, "$1\n");
  const expressionPattern = /(\d+(?:\.\d+)?)([×÷+\-])(\d+(?:\.\d+)?)＝/g;
  let guard = 0;

  while (guard < 20) {
    guard += 1;
    let insertAt = -1;
    let match;
    expressionPattern.lastIndex = 0;
    while ((match = expressionPattern.exec(text))) {
      const [expr, leftText, op, rightText] = match;
      const left = Number(leftText);
      const right = Number(rightText);
      let value = null;
      if (op === "×") value = left * right;
      if (op === "÷" && right !== 0) value = left / right;
      if (op === "+") value = left + right;
      if (op === "-") value = left - right;
      if (value === null || !Number.isFinite(value)) continue;

      const valueText = Number.isInteger(value) ? String(value) : String(Math.round(value * 1000) / 1000);
      const start = match.index + expr.length;
      const afterValue = start + valueText.length;
      if (
        text.slice(start).startsWith(valueText) &&
        /^\d+(?:\.\d+)?[×÷+\-]/.test(text.slice(afterValue))
      ) {
        insertAt = afterValue;
        break;
      }
    }
    if (insertAt < 0) break;
    text = `${text.slice(0, insertAt)}\n${text.slice(insertAt)}`;
  }

  return text;
}

function getExpectedAnswers(question) {
  if (Array.isArray(question.anyOrderAnswers)) return question.anyOrderAnswers.map(String);
  if (Array.isArray(question.answer)) return question.answer.map(String);
  const answers = String(question.answer).includes("\uFF0C") || String(question.answer).includes(",")
    ? String(question.answer).split(/[\uFF0C,]/).map((item) => item.trim()).filter(Boolean)
    : [String(question.answer)];
  if (question.suffix && /^[\uFF0C,\u3001、]/.test(String(question.suffix))) {
    const extra = String(question.suffix).replace(/^[\uFF0C,\u3001、]\s*/, "").trim();
    if (extra) answers.push(...extra.split(/[\uFF0C,\u3001、]/).map((item) => item.trim()).filter(Boolean));
  } else if (question.suffix && /[\uFF0C,\u3001、]/.test(String(question.suffix))) {
    const parts = String(question.suffix).split(/[\uFF0C,\u3001、]/).map((item) => item.trim()).filter(Boolean);
    if (parts.length) {
      answers[0] = `${answers[0]}${parts[0]}`;
      answers.push(...parts.slice(1));
    }
  }
  return answers;
}

function isSingleAlternativeQuestion(question) {
  const prompt = String(question.prompt);
  return /可能是多少/.test(prompt) && !/不可能/.test(prompt);
}

function splitAnswerOptions(value) {
  return String(value).split(/[\uFF0C,\u3001、]/).map((item) => item.trim()).filter(Boolean);
}

function getAcceptedAnswers(question) {
  const answers = splitAnswerOptions(question.answer);
  if (question.suffix && /^[\uFF0C,\u3001、]/.test(String(question.suffix))) {
    answers.push(...splitAnswerOptions(question.suffix));
  }
  return answers;
}

function isCorrectAnswer(value, question) {
  if (Array.isArray(question.anyOrderAnswers)) {
    const expected = question.anyOrderAnswers.map(normalizeAnswer).sort();
    const given = (Array.isArray(value) ? value : String(value).split(/[\uFF0C,\u3001\s]+/))
      .filter(Boolean)
      .map(normalizeAnswer)
      .sort();
    return expected.length === given.length && expected.every((answer, index) => answersMatch(given[index], answer));
  }
  if (Array.isArray(question.acceptedAnswers)) {
    const accepted = question.acceptedAnswers.map(normalizeAnswer);
    return accepted.some((answer) => answersMatch(value, answer));
  }
  if (isSingleAlternativeQuestion(question)) {
    const accepted = getAcceptedAnswers(question).map(normalizeAnswer);
    return accepted.some((answer) => answersMatch(value, answer));
  }
  if (question.type === "choice") {
    if (isComputedDurationAnswer(value, question)) return true;
    const accepted = [question.answer, ...(Array.isArray(question.acceptedAnswers) ? question.acceptedAnswers : [])]
      .flat()
      .map(String);
    return accepted.some((answer) => answersMatch(value, answer));
  }
  const expected = getExpectedAnswers(question).map(normalizeAnswer);
  if (expected.length === 1) {
    return expected.some((answer) => answersMatch(value, answer));
  }
  const given = Array.isArray(value)
    ? value.map(normalizeAnswer)
    : String(value).split(/[\uFF0C,\u3001\s]+/).filter(Boolean).map(normalizeAnswer);
  if (expected.length !== given.length) return false;
  if (isEquivalentMeridiemTimeAnswer(question, given, expected)) return true;
  return expected.every((answer, index) => answersMatch(given[index], answer));
}

function isComputedDurationAnswer(value, question) {
  const prompt = String(question.prompt);
  if (!/經過多久/.test(prompt)) return false;
  const match = prompt.match(/(\d{1,2})\s*:\s*(\d{2})[\s\S]*?(\d{1,2})\s*:\s*(\d{2})/);
  if (!match) return false;
  const [, startHourText, startMinuteText, endHourText, endMinuteText] = match;
  const start = Number(startHourText) * 60 + Number(startMinuteText);
  let end = Number(endHourText) * 60 + Number(endMinuteText);
  if (end < start) end += 24 * 60;
  const duration = end - start;
  const givenNumber = extractNumericAnswer(value);
  return givenNumber !== null && Number(givenNumber) === duration;
}

function isEquivalentMeridiemTimeAnswer(question, given, expected) {
  if (!/下午/.test(String(question.prompt)) || expected.length !== 2 || given.length !== 2) return false;
  if (!isPlainNumber(given[0]) || !isPlainNumber(given[1]) || !isPlainNumber(expected[0]) || !isPlainNumber(expected[1])) return false;
  const givenHour = Number(given[0]);
  const givenMinute = Number(given[1]);
  const expectedHour = Number(expected[0]);
  const expectedMinute = Number(expected[1]);
  const expected24Hour = expectedHour === 12 ? 12 : expectedHour + 12;
  return givenMinute === expectedMinute && (givenHour === expectedHour || givenHour === expected24Hour);
}

function answersMatch(given, expected) {
  const normalizedGiven = normalizeAnswer(given);
  const normalizedExpected = normalizeAnswer(expected);
  if (normalizedGiven === normalizedExpected) return true;
  if (isPlainNumber(normalizedGiven) && isPlainNumber(normalizedExpected)) {
    return Number(normalizedGiven) === Number(normalizedExpected);
  }
  const givenNumber = extractNumericAnswer(normalizedGiven);
  const expectedNumber = extractNumericAnswer(normalizedExpected);
  if (givenNumber !== null && expectedNumber !== null) {
    return Number(givenNumber) === Number(expectedNumber);
  }
  return false;
}

function isPlainNumber(value) {
  return /^-?\d+(?:\.\d+)?$/.test(String(value));
}

function extractNumericAnswer(value) {
  const text = normalizeAnswer(value)
    .replace(/[()（）]/g, "")
    .replace(/答案是/g, "");
  const match = text.match(/^-?\d+(?:\.\d+)?/);
  if (!match) return null;
  const rest = text.slice(match[0].length);
  if (!rest) return match[0];
  return /^[\u4e00-\u9fff]+$/.test(rest) ? match[0] : null;
}

function grantReward() {
  const roll = Math.random();
  let id = "woodSword";
  if (state.correct >= 6 && roll < 0.34) id = "starSword";
  else if (state.correct >= 3 && roll < 0.48) id = "ironSword";
  else if (roll < 0.64) id = "heart";
  else if (roll < 0.82) id = "shield";
  else if (roll < 0.94) id = "crystal";

  const reward = { id, ...rewardTypes[id] };
  state.rewards.push(reward);
  rewardIcon.src = reward.icon;
  rewardName.textContent = reward.name;
  rewardCard.classList.remove("hidden");
  return reward;
}

function handleExploreAnswer(value) {
  const question = state.currentQuestion;
  const correct = isCorrectAnswer(value, question);
  const index = Number.isInteger(question.__sourceIndex) ? question.__sourceIndex : islands[state.island].questions.indexOf(question);
  state.answered.push(index >= 0 ? index : `random-${Date.now()}-${Math.random()}`);
  markCurrentNodeVisited();
  state.tutorialSeen = true;
  updateTutorialArrow();

  if (correct) {
    state.correct += 1;
    state.combo += 1;
    state.maxCombo = Math.max(state.maxCombo, state.combo);
    const reward = grantReward();
    playSfx("correct");
    playSfx("reward");
    feedback.textContent = `答對了！獲得 ${reward.name}，決鬥場可以使用。`;
    feedback.classList.add("good");
  } else {
    state.combo = 0;
    playSfx("wrong");
    feedback.textContent = `沒有拿到寶物。${question.explain}`;
    feedback.classList.add("bad");
  }

  refreshExplorationNodesIfNeeded();
  answerArea.querySelectorAll("button, input").forEach((el) => (el.disabled = true));
  numberPad.querySelectorAll("button").forEach((el) => (el.disabled = true));
  nextQuestion.classList.remove("hidden");
  updateHud();
}

function refreshExplorationNodesIfNeeded() {
  if (state.flight?.active || isBossReady()) return;
  const available = eventNodes.some((node) => !node.classList.contains("visited") && !node.classList.contains("time-hidden-node"));
  const hasEnoughAttemptsForRefresh = state.answered.length >= getChallengeTarget();
  if (available && !hasEnoughAttemptsForRefresh) return;
  eventNodes.forEach((node) => {
    if (node.classList.contains("time-hidden-node")) return;
    node.classList.remove("visited");
    node.disabled = false;
    node.setAttribute("aria-disabled", "false");
  });
  missionLog.textContent = `還需要答對 ${getChallengeTarget() - state.correct} 題，新的目標又亮起來了。`;
}

function renderAnswerControls(question, target, padTarget, callback) {
  target.innerHTML = "";
  padTarget.innerHTML = "";
  padTarget.classList.add("hidden");

  if (question.type === "choice") {
    [...question.choices].sort(() => Math.random() - 0.5).forEach((choice) => {
      const button = document.createElement("button");
      button.className = "answer-button";
      button.textContent = choice;
      button.addEventListener("click", () => callback(choice));
      target.append(button);
    });
    return;
  }

  const row = document.createElement("div");
  row.className = "fill-row";
  const isAlternative = isSingleAlternativeQuestion(question);
  const expectedAnswers = isAlternative ? [getAcceptedAnswers(question)[0] || ""] : getExpectedAnswers(question);
  const inputs = expectedAnswers.map((_, index) => {
    const input = document.createElement("input");
    input.inputMode = expectedAnswers.some((answer) => String(answer).includes("/")) ? "text" : "decimal";
    input.autocomplete = "off";
    input.placeholder = isAlternative ? "輸入其中一個答案" : (expectedAnswers.length > 1 ? `第 ${index + 1} 格答案` : (question.suffix ? `輸入答案（${question.suffix}）` : "輸入答案"));
    return input;
  });
  const submit = document.createElement("button");
  submit.className = "primary";
  submit.textContent = "送出";
  submit.addEventListener("click", () => {
    const values = inputs.map((input) => input.value);
    if (values.every(Boolean)) callback(expectedAnswers.length > 1 ? values : values[0]);
  });
  inputs.forEach((input) => {
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        const values = inputs.map((item) => item.value);
        if (values.every(Boolean)) callback(expectedAnswers.length > 1 ? values : values[0]);
      }
    });
    row.append(input);
  });
  row.append(submit);
  target.append(row);

  let activeInput = inputs[0];
  inputs.forEach((input) => input.addEventListener("focus", () => {
    activeInput = input;
  }));

  ["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0", ":", "/", "清除"].forEach((key) => {
    const keyButton = document.createElement("button");
    keyButton.textContent = key;
    keyButton.addEventListener("click", () => {
      activeInput.value = key === "清除" ? "" : activeInput.value + key;
      activeInput.focus();
    });
    padTarget.append(keyButton);
  });
  padTarget.classList.remove("hidden");
  window.setTimeout(() => inputs[0].focus(), 50);
}
